<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>修剪树枝管理系统</title>
<link rel="stylesheet" href="/static/leaflet/leaflet.css"/>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2329; --mut:#8a8f99;
    --line:#e5e6eb; --brand:#0f6e56; --brand2:#185fa5; --warn:#ba7517; --ok:#3b6d11;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;overflow:hidden}
  header{background:linear-gradient(135deg,#0f6e56,#185fa5);color:#fff;height:68px;padding:0 12px;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  header .ttl{flex:1;min-width:0;text-align:center}
  header .ttl h1{margin:0;font-size:20px;line-height:1.3;font-weight:600;white-space:nowrap}
  /* 内页（地图/作业）顶部栏标题缩小，避免与返回按钮挤 */
  header.sm .ttl h1{font-size:15px;line-height:1.2}
  header .ttl p{display:none}
  header img.logo{height:34px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  header .back-btn,header .exit{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  button{font-size:15px;font-weight:600;border:none;border-radius:10px;padding:12px 16px;cursor:pointer}
  .btn-primary{background:var(--brand);color:#fff;width:100%}
  .btn-ghost{background:#eef1f5;color:var(--ink);width:100%}
  .btn-sm{background:#eef1f5;color:var(--brand);padding:8px 12px;font-size:13px;border-radius:8px}
  .hidden{display:none !important}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.82);
    color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}

  /* 登录页 —— 固定全屏覆盖，未登录时什么都看不到 */
  #loginView{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0f6e56,#185fa5)}
  .login-card{width:340px;max-width:90vw;background:#fff;border-radius:18px;padding:30px 26px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
  .login-card img{max-width:180px;width:auto;height:auto;max-height:90px;margin-bottom:16px}
  .login-card h2{margin:4px 0 2px;font-size:20px;color:var(--ink)}
  .login-card .sub{font-size:12px;color:var(--mut);margin-bottom:18px}
  .login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:12px;outline:none}
  .login-card input:focus{border-color:var(--brand)}
  .login-err{color:#d4380d;font-size:13px;min-height:18px;margin-bottom:8px}

  /* 主框架；用 100dvh 兼容 iOS Safari 底部工具栏 */
  #appView{display:flex;flex-direction:column;height:100vh;height:100dvh}
  main{flex:1;position:relative;overflow:hidden;background:var(--bg)}
  #homeSection,#mapSection,#jobSection{position:absolute;inset:0}
  #homeSection{display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
  #jobSection{overflow:auto;padding-bottom:90px}

  /* 首页两个大按钮 */
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:640px}
  .home-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 22px;text-align:center;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.06);transition:transform .15s,border-color .15s,box-shadow .15s}
  .home-card:hover,.home-card:active{border-color:var(--brand);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
  .home-card .icon{font-size:46px;margin-bottom:14px}
  .home-card h3{margin:0 0 10px;font-size:19px;color:var(--brand)}
  .home-card p{margin:0;font-size:13px;color:var(--mut);line-height:1.55}
  @media(max-width:520px){.home-grid{grid-template-columns:1fr}}

  /* 作业录入（复用） */
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;background:#fff;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  input[type="date"]{-webkit-appearance:none;appearance:none;min-height:42px;height:42px;padding:11px 12px;font-size:15px;line-height:normal;text-align:left}
  .pole-red-ic{width:16px;height:16px;border-radius:50%;background:#e74c3c;border:2px solid #fff;box-shadow:0 0 0 3px rgba(231,76,60,.5)}
  textarea{resize:vertical;min-height:64px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .pole{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);
    border-radius:10px;padding:12px;margin-top:8px;cursor:pointer}
  .pole:hover{border-color:var(--brand)}
  .pole .no{font-weight:600}.pole .d{font-size:12px;color:var(--mut)}
  .tag{display:inline-block;background:#e1f5ee;color:var(--brand);font-size:12px;padding:2px 8px;border-radius:6px;margin-left:8px}
  hr{border:none;border-top:1px dashed var(--line);margin:14px 0}
  .link{color:var(--brand2);font-size:13px;cursor:pointer;margin-top:8px;display:inline-block}
  .locline{font-size:13px;color:var(--mut);margin-top:8px}
  .step{font-size:12px;color:var(--brand);font-weight:600;margin-bottom:4px}
  .sub-t{font-size:12px;color:var(--mut);margin:12px 0 2px}

  /* 地图管理 */
  /* 缩小地图叠加层文字（约原 2/3；瓦片内路名/POI 文字是图片，无法调） */
  .leaflet-control-attribution{font-size:8px !important;padding:1px 5px !important}
  .leaflet-control-zoom{margin-top:72px !important}
  .leaflet-control-zoom a{width:26px;height:26px;line-height:24px;font-size:15px}
  .leaflet-popup-content{font-size:13px;margin:10px 12px}
  .leaflet-popup-content b{font-size:14px}
  .search-bar{position:absolute;top:12px;left:12px;right:12px;z-index:1000;background:#fff;
    border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .search-bar input{border:none;padding:8px 4px;margin:0;font-size:15px}
  .search-bar input:focus{border:none}
  .search-bar .cnt{font-size:12px;color:var(--mut);white-space:nowrap}
  #mapAdmin{position:absolute;inset:0;background:#e8eaed}
  #poleDetail{position:absolute;right:12px;top:74px;bottom:12px;width:340px;max-width:calc(100% - 24px);
    background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.22);z-index:1000;
    display:none;flex-direction:column;overflow:hidden}
  #poleDetail.show{display:flex}
  #poleDetail .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  #poleDetail .ph b{font-size:15px}
  #poleDetail .ph .x{cursor:pointer;color:var(--mut);font-size:20px;line-height:1}
  #poleDetail .pb{padding:12px 14px;overflow:auto;font-size:13px}
  .kv{margin:2px 0;color:var(--ink)}
  .kv .k{color:var(--mut)}
  .nav-row{display:flex;gap:8px;margin:10px 0}
  #typhoonCtrl{position:absolute;bottom:20px;right:12px;z-index:1100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  #typhoonCtrl button{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;
    padding:8px 14px;font-size:14px;font-weight:600;color:#2c3e50;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
  #typhoonCtrl button.on{background:#c0392b;color:#fff;border-color:#c0392b}
  #lineBtn.on{background:#2c7be5;color:#fff;border-color:#2c7be5}
  #typhoonBanner{position:absolute;top:64px;left:12px;right:12px;z-index:1150;background:#c0392b;color:#fff;
    border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.45;box-shadow:0 2px 10px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
  #typhoonBanner b{font-size:14px}
  .nav-row a{flex:1;text-align:center;text-decoration:none;color:#fff;border-radius:10px;padding:10px;font-size:14px;font-weight:600}
  .nav-row .amap{background:#0f6e56}.nav-row .baidu{background:#1a73e8}
  .job-item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
  .job-item .jt{font-weight:600;color:var(--brand2)}
  .job-item .jm{font-size:12px;color:var(--mut);margin-top:3px}
  /* 作业照片缩略图组 */
  .pg-l{font-size:12px;color:var(--mut);font-weight:600;margin:6px 0 4px}
  .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .pg-i{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;cursor:pointer;background:#eee;border:1px solid var(--line)}
  /* 照片大图查看器 */
  #photoViewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:2000;flex-direction:column}
  #photoViewer.show{display:flex}
  #photoViewer .pv-img{max-width:96%;max-height:82%;object-fit:contain;border-radius:8px}
  #photoViewer .pv-close{position:absolute;top:14px;right:18px;color:#fff;font-size:34px;line-height:1;cursor:pointer;z-index:1}
  #photoViewer .pv-nav{position:absolute;bottom:18px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:26px;color:#fff;font-size:15px}
  #photoViewer .pv-nav span{cursor:pointer;user-select:none;padding:6px 16px;background:rgba(255,255,255,.15);border-radius:20px}

  /* 地图选点弹窗 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .mask.show{display:flex}
  .mapbox{background:#fff;border-radius:14px;width:100%;max-width:520px;overflow:hidden}
  .mapbox .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .mapbox .bar b{font-size:14px}
  #map{height:340px;width:100%}
  .mapbox .tip{font-size:12px;color:var(--mut);padding:8px 14px;border-top:1px solid var(--line)}
  .mapbox .ft{padding:12px 14px;display:flex;gap:10px}
  .mapbox .ft button{flex:1}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginView">
  <div class="login-card">
    <img src="/static/senyo.png" alt="SENYO">
    <h2>修剪树枝管理系统</h2>
    <div class="sub">SENYO · 电杆定位与修剪作业管理</div>
    <input id="lg_user" placeholder="账号" autocomplete="username">
    <input id="lg_pass" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-err" id="lg_err"></div>
    <button class="btn-primary" onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- 主应用 -->
<div id="appView" class="hidden">
  <header id="topbar">
    <button class="back-btn hidden" id="backBtn" onclick="showPage('home')">← 返回</button>
    <div class="ttl"><h1>修剪树枝<br>管理系统</h1><p id="headerSub">请选择功能</p></div>
    <img class="logo" src="/static/logo.png" alt="SENYO">
    <button class="exit" onclick="doLogout()">退出</button>
  </header>
  <main>
    <!-- 首页：两个大按钮 -->
    <div id="homeSection">
      <div class="home-grid">
        <div class="home-card" onclick="showPage('map')">
          <div class="icon">🗺️</div>
          <h3>地图管理</h3>
          <p>查看电杆分布、搜索编号、浏览作业记录、一键导航</p>
        </div>
        <div class="home-card" onclick="showPage('job')">
          <div class="icon">📝</div>
          <h3>作业记录</h3>
          <p>搜索或新建电杆，录入当天修剪作业与照片</p>
        </div>
      </div>
    </div>

    <!-- 板块1：地图管理 -->
    <div id="mapSection" class="hidden">
      <div class="search-bar">
        <input id="mapSearch" placeholder="搜索电杆编号…" oninput="filterMap()" style="flex:1">
        <span class="cnt" id="mapCnt"></span>
      </div>
      <div id="mapAdmin"></div>
      <div id="poleDetail">
        <div class="ph"><b id="pd_title">电杆详情</b><span class="x" onclick="hideDetail()">×</span></div>
        <div class="pb" id="pd_body"></div>
      </div>
      <div id="typhoonCtrl">
        <button id="tyBtn" onclick="toggleTyphoon()">🌀 台风图层</button>
        <button id="lineBtn" onclick="toggleLine()">🔗 线路连线</button>
        <button id="locBtn" onclick="locateMe()">📍 我的位置</button>
      </div>
      <div id="typhoonBanner" class="hidden"></div>
    </div>

    <!-- 板块2：作业记录（原录入端） -->
    <div id="jobSection" class="hidden">
      <div class="wrap">
        <div class="card" id="searchCard">
          <div class="step">第 1 步 · 查找电杆</div>
          <div class="row">
            <input id="q" placeholder="输入电杆编号查找" onkeydown="if(event.key==='Enter')searchPoles()">
            <button class="btn-sm" style="flex:0 0 88px" onclick="searchPoles()">搜索</button>
          </div>
          <div id="recentWrap" class="hidden">
            <div class="sub-t">最近选择（最多 4 个，点一下直接选）</div>
            <div id="recentPoles"></div>
          </div>
          <span class="link" onclick="showNewPole()">找不到？点此新建电杆 →</span>
          <div id="poleList"></div>
        </div>

        <div class="card hidden" id="newPoleCard">
          <div class="step">第 1.5 步 · 新建电杆（仅录编号 + 定位）</div>
          <label>电杆编号 *</label>
          <input id="np_no" placeholder="10kV电站F1什么线#01杆">
          <label>定位 *</label>
          <button class="btn-sm" style="width:auto" onclick="openMap()">选择定位（地图选点）</button>
          <div class="locline" id="locline">未选择定位</div>
          <label>位置描述</label>
          <input id="np_desc" placeholder="如 XX路XX号旁">
          <label>所属供电所（默认：佛山 / 三水 / 乐平）</label>
          <select id="np_area1" onchange="fillArea2()"><option value="">请选择市局</option></select>
          <select id="np_area2" onchange="fillArea3()" style="margin-top:10px"><option value="">请选择区/县供电局</option></select>
          <select id="np_area3" style="margin-top:10px"><option value="">请选择供电所（无则选"无"）</option></select>
          <button class="btn-primary" style="margin-top:14px" onclick="submitNewPole()">新建并继续</button>
          <button class="btn-ghost" style="margin-top:8px" onclick="backToSearch()">返回</button>
        </div>

        <div class="card hidden" id="jobCard">
          <div class="step">第 2 步 · 记录当天作业</div>
          <div style="font-size:13px;color:var(--mut)">当前电杆：<b id="curPole"></b> <span class="tag" id="curTag">已选</span></div>
          <hr>
          <label>工作票编号</label>
          <input id="j_ticket" placeholder="如2026-11-7-001">
          <div class="row">
            <div><label>作业日期 *</label><input id="j_date" type="date"></div>
          </div>
          <label>作业人员</label>
          <input id="j_worker" placeholder="姓名">
          <label>树木品种</label>
          <input id="j_tree" placeholder="如 榕树">
          <label>修剪前隐患等级</label>
          <select id="j_risk">
            <option>低</option><option>中</option><option>高</option>
          </select>
          <label>剪下树枝量</label>
          <input id="j_branch" placeholder="如 3 车 / 200kg">
          <label>修剪前情况（拍照 / 选照片）</label>
          <input id="j_before" type="file" accept="image/*" multiple>
          <label>修剪后情况（拍照 / 选照片）</label>
          <input id="j_after" type="file" accept="image/*" multiple>
          <label>站班会情况（拍照 / 选照片）</label>
          <input id="j_station" type="file" accept="image/*" multiple>
          <label>标示牌等线路装置状态</label>
          <select id="j_sign">
            <option>完好</option><option>缺失</option><option>需更换</option>
          </select>
          <label>附件（拍照 / 选照片，记录有缺陷的标示牌等线路装置状态）</label>
          <input id="j_attach" type="file" accept="image/*" multiple>
          <label>备注</label>
          <textarea id="j_note" placeholder="其他情况"></textarea>
          <button class="btn-primary" style="margin-top:14px" onclick="submitJob()">提交作业</button>
          <button class="btn-ghost" style="margin-top:8px" onclick="resetAll()">重新选择电杆</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 地图选点弹窗 -->
<div class="mask" id="mapMask">
  <div class="mapbox">
    <div class="bar"><b>在地图上点击选点</b><span class="link" onclick="closeMap()">取消</span></div>
    <div id="map"></div>
    <div class="tip">点击地图位置落点，再点确认</div>
    <div class="ft">
      <button class="btn-ghost" onclick="closeMap()">取消</button>
      <button class="btn-primary" onclick="confirmMap()">确认选点</button>
    </div>
  </div>
</div>

<!-- 照片大图查看器 -->
<div class="mask" id="photoViewer">
  <div class="pv-close" onclick="closePhoto()">×</div>
  <img class="pv-img" id="pv_img" src="" alt="照片" onclick="closePhoto()">
  <div class="pv-nav">
    <span id="pv_prev" onclick="pvStep(-1)">‹</span>
    <span id="pv_idx"></span>
    <span id="pv_next" onclick="pvStep(1)">›</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/leaflet/leaflet.js"></script>
<script>
/* ===== 通用 ===== */
function toast(msg,dur){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur||2200);}
const AREA_TREE = {
  "佛山供电局": {
    "禅城供电局": [], "南海供电局": ["大沥供电所","里水供电所","九江供电所","西樵供电所","罗村供电所","平洲供电所","狮山供电所"],
    "顺德供电局": ["大良供电所","北滘供电所","陈村供电所","乐从供电所","伦教供电所","容桂供电所","均安供电所","杏坛供电所"],
    "三水供电局": ["西南供电所","白坭供电所","乐平供电所","芦苞供电所","大塘供电所"],
    "高明供电局": ["荷城供电所","杨和供电所","明城供电所","更合供电所"]
  },
  "广州供电局": {
    "越秀供电局": [], "荔湾供电局": [], "海珠供电局": [], "天河供电局": [],
    "白云供电局": ["江高供电所","人和供电所","钟落潭供电所","西郊供电所"],
    "黄埔供电局": ["九龙供电所","萝岗供电所"],
    "番禺供电局": ["南村供电所","石楼供电所","大岗供电所","东涌供电所","大石供电所"],
    "花都供电局": ["花东供电所","赤坭供电所","炭步供电所","雅瑶供电所"],
    "增城供电局": ["新塘供电所","仙村供电所","石滩供电所","派潭供电所"],
    "从化供电局": ["城郊供电所","温泉供电所","良口供电所","鳌头供电所","太平供电所","吕田供电所"]
  }
};

/* ===== 登录 ===== */
async function boot(){
  try{
    const r = await fetch('/api/me', {credentials:'same-origin'});
    if(r.ok){ const d = await r.json(); enterApp(d.user); return; }
  }catch(e){}
  document.getElementById('loginView').classList.remove('hidden');
}
async function doLogin(){
  const u = document.getElementById('lg_user').value.trim();
  const p = document.getElementById('lg_pass').value;
  const r = await fetch('/api/login', {method:'POST', credentials:'same-origin',

/* 坐标转换：WGS84 -> GCJ02 -> BD09 */
const PI=Math.PI, A=6378245.0, EE=0.00669342162296594323;
function outOfChina(lng,lat){return !(lng>73.66&&lng<135.05&&lat>3.86&&lat<53.55);}
function tLat(lng,lat){let r=-100+2*lng+3*lat+0.2*lat*lat+0.1*lng*lat+0.2*Math.sqrt(Math.abs(lng));r+=(20*Math.sin(6*lng*PI)+20*Math.sin(2*lng*PI))*2/3;r+=(20*Math.sin(lat*PI)+40*Math.sin(lat/3*PI))*2/3;r+=(160*Math.sin(lat/12*PI)+320*Math.sin(lat*PI/30))*2/3;return r;}
function tLng(lng,lat){let r=300+lng+2*lat+0.1*lng*lng+0.1*lng*lat+0.1*Math.sqrt(Math.abs(lng));r+=(20*Math.sin(6*lng*PI)+20*Math.sin(2*lng*PI))*2/3;r+=(20*Math.sin(lng*PI)+40*Math.sin(lng/3*PI))*2/3;r+=(150*Math.sin(lng/12*PI)+300*Math.sin(lng/30*PI))*2/3;return r;}
function wgs2gcj(lng,lat){if(outOfChina(lng,lat))return[lng,lat];let dlat=tLat(lng-105,lat-35),dlng=tLng(lng-105,lat-35);let rl=lat/180*PI,m=Math.sin(rl);m=1-EE*m*m;let sm=Math.sqrt(m);dlat=(dlat*180)/((A*(1-EE))/(m*sm)*PI);dlng=(dlng*180)/((A/sm)*Math.cos(rl)*PI);return [lng+dlng,lat+dlat];}
function gcj2bd(lng,lat){let x=lng,y=lat,z=Math.sqrt(x*x+y*y)+0.00002*Math.sin(y*PI),th=Math.atan2(y,x)+0.000003*Math.cos(x*PI);return [z*Math.cos(th)+0.0065,z*Math.sin(th)+0.0065];}

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371,toR=d=>d*Math.PI/180;
  const dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function windRadiusKm(w){
  if(!w) return 0;
  const arr=[parseFloat(w.neRadius),parseFloat(w.seRadius),parseFloat(w.swRadius),parseFloat(w.nwRadius)].filter(v=>!isNaN(v)&&v>0);
  return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
}

  if(!(rkm>0)) return res;
  (_allPoles||[]).forEach(p=>{ if(p.lat==null||p.lng==null) return; if(haversineKm(lat,lng,p.lat,p.lng)<=rkm) res.push(p); });

}

    _tyOn=true; btn.classList.add('on'); btn.textContent='🌀 关闭台风';
    _tyTimer=setInterval(async()=>{ try{const r2=await fetch('/api/weather/typhoon',{credentials:'same-origin'});const d2=await r2.json();if(d2.ok)drawTyphoon(d2);}catch(e){} },15*60*1000);
  }catch(e){ toast('请求台风数据出错'); btn.textContent='🌀 台风图层'; }
}
let _linePalette=['#2c7be5','#e67e22','#27ae60','#8e44ad','#16a085','#c0392b','#d35400','#2980b9'];
function parsePoleLine(no){
  if(!no) return {line:'未命名', seq:0};
  const i=no.indexOf('#');
  if(i<0) return {line:(no||'未命名').trim(), seq:0};
  const line=no.substring(0,i).trim()||'未命名';
  const rest=no.substring(i+1);
  const m=rest.match(/\d+/);
  const seq=m?parseInt(m[0],10):0;
  return {line, seq};
}
function buildLineLayer(){
  const groups={};
  (_allPoles||[]).forEach(p=>{
    if(p.lat==null||p.lng==null) return;
    const {line,seq}=parsePoleLine(p.pole_no);
    (groups[line]=groups[line]||[]).push({p,seq});
  });
  const layer=L.layerGroup();
  const lines=Object.keys(groups);
  let ci=0, drawn=0;
  lines.forEach(line=>{
    const arr=groups[line].sort((a,b)=>a.seq-b.seq);
    const pts=arr.map(o=>[o.p.lat,o.p.lng]);
    if(pts.length>=2){
      const color=_linePalette[ci%_linePalette.length];
      L.polyline(pts,{color,weight:3.5,opacity:.9,interactive:false}).addTo(layer);
      ci++; drawn++;
    }
  });
  return {layer, drawn, total:lines.length};
}
function toggleLine(){
  const btn=document.getElementById('lineBtn');
  if(_lineOn){
    if(_lineLayer){_mapAdmin.removeLayer(_lineLayer);_lineLayer=null;}
    _lineOn=false; btn.classList.remove('on'); btn.textContent='🔗 线路连线';
    return;
  }
  if(!_allPoles||!_allPoles.length){ toast('暂无电杆数据，请先在地图页加载'); return; }
  const res=buildLineLayer();
  if(res.drawn===0){
    toast('每条线路需至少2根电杆才能连线；当前每条线路仅1根（测试数据）',3500);
    return;
  }
  res.layer.addTo(_mapAdmin);
  _lineLayer=res.layer; _lineOn=true; btn.classList.add('on'); btn.textContent='✖ 关闭连线';
  toast('已按 '+res.drawn+' 条线路连线（共 '+res.total+' 条线路，'+(res.total-res.drawn)+' 条不足2杆跳过）',3200);
}
function drawTyphoon(d){
  clearTyphoon();
  _tyLayer=L.layerGroup().addTo(_mapAdmin);
  const affectedAll=[];
  (d.storms||[]).forEach(st=>{
    const tpts=(st.track||[]).filter(p=>p.lat!=null&&p.lng!=null).map(p=>[p.lat,p.lng]);
    if(tpts.length) L.polyline(tpts,{color:'#7f8c8d',weight:2,opacity:.85}).addTo(_tyLayer);
    const fpts=(st.forecast||[]).filter(p=>p.lat!=null&&p.lng!=null).map(p=>[p.lat,p.lng]);
    if(fpts.length) L.polyline(fpts,{color:'#e74c3c',weight:2,dashArray:'6 6',opacity:.9}).addTo(_tyLayer);
    const eye=st.now;
    if(eye&&eye.lat!=null&&eye.lng!=null){
      L.circleMarker([eye.lat,eye.lng],{radius:7,color:'#fff',weight:2,fillColor:'#e74c3c',fillOpacity:1})
        .bindTooltip('🌀 '+st.name+' '+(eye.windSpeed||'?')+'m/s',{permanent:true,direction:'top'})
        .addTo(_tyLayer);
      const rkm=windRadiusKm(eye.windRadius30);
      if(rkm>0) L.circle([eye.lat,eye.lng],{radius:rkm*1000,color:'#e74c3c',weight:1,fillColor:'#e74c3c',fillOpacity:.12,opacity:.6}).addTo(_tyLayer);
      const aff=affectedPoles(eye.lat,eye.lng,rkm);
      if(aff.length) affectedAll.push({name:st.name,poles:aff});
    }
  });
  if(affectedAll.length){
    let html='⚠️ <b>台风预警</b>：';
    affectedAll.forEach(a=>{ html+='<br>'+a.name+' 风圈覆盖 <b>'+a.poles.length+'</b> 根电杆：'+a.poles.slice(0,8).map(p=>p.pole_no).join('、')+(a.poles.length>8?'…':''); a.poles.forEach(p=>{ const m=_markers[p.record_id]; if(m) m.setIcon(_poleRedIcon); }); });
    showTyBanner(html);
  } else {
    // 台风在远海时整层不在视野内，自动飞到台风眼并提示距离
    const eyes=(d.storms||[]).map(s=>s.now).filter(e=>e&&e.lat!=null&&e.lng!=null);
    if(eyes.length){
      const e0=eyes[0], el=[e0.lat,e0.lng];
      if(!_mapAdmin.getBounds().contains(el)) _mapAdmin.flyTo(el, 5);
      let minD=1e9, near='';
      (window._allPoles||[]).forEach(p=>{ if(p.lat!=null&&p.lng!=null){ const dd=haversineKm(p.lat,p.lng,e0.lat,e0.lng); if(dd<minD){minD=dd;near=p.pole_no;} } });
      toast('🌀 '+(d.storms[0].name||'台风')+' 位于远海('+e0.lat.toFixed(1)+'N,'+e0.lng.toFixed(1)+'E)，距最近电杆「'+(near||'?')+'」约 '+Math.round(minD)+'km', 3500);
    }
  }
}
async function submitNewPole(){
  const no=document.getElementById('np_no').value.trim();
  if(!no){toast('电杆编号必填');return;}
  if(window._lat==null||window._lng==null){toast('请先选择定位');return;}
  const a1=document.getElementById('np_area1').value,a2=document.getElementById('np_area2').value,a3=document.getElementById('np_area3').value;
  const area=[a1,a2,a3].filter(v=>v&&v!=="无").join(' / ');
  const r=await fetch('/api/poles',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
    body:JSON.stringify({pole_no:no,lng:String(window._lng),lat:String(window._lat),desc:document.getElementById('np_desc').value,area})});
  const d=await r.json();
  if(!d.record_id){toast('建杆失败: '+(d.error||''));return;}
  toast('电杆已新建'); selectPole(d.record_id,no);
}
async function filesToB64(input){
  return Promise.all(Array.from(input.files).map(f=>new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const p=String(r.result).split(',');res({name:f.name,data:p[1]||''});};
    r.onerror=()=>res(null);
    r.readAsDataURL(f);
  }))).then(x=>x.filter(Boolean));
}
async function submitJob(){
  if(!window._rid){toast('请先选择或新建电杆');return;}
  if(!document.getElementById('j_ticket').value.trim()){toast('工作票编号必填');return;}
  const photos={before:await filesToB64(document.getElementById('j_before')),after:await filesToB64(document.getElementById('j_after')),
    station:await filesToB64(document.getElementById('j_station')),attach:await filesToB64(document.getElementById('j_attach'))};
  const body={pole_record_id:window._rid,ticket:document.getElementById('j_ticket').value.trim(),job_date:document.getElementById('j_date').value,
    worker:document.getElementById('j_worker').value,tree:document.getElementById('j_tree').value,risk:document.getElementById('j_risk').value,
    branch:document.getElementById('j_branch').value,sign:document.getElementById('j_sign').value,note:document.getElementById('j_note').value,photos};
  const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
  const d=await r.json();
  if(d.ok){toast('作业已提交 ✓');resetAll();}
  else toast('提交失败: '+(d.error||JSON.stringify(d)));
}
function resetAll(){
  hide('jobCard');hide('newPoleCard');show('searchCard');
  document.getElementById('poleList').innerHTML='';document.getElementById('q').value='';renderRecent();
  document.getElementById('locline').textContent='未选择定位';
  ['j_ticket','j_worker','j_tree','j_branch','j_note','np_no','np_desc','j_before','j_after','j_station','j_attach'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  ['j_risk','j_sign'].forEach(id=>document.getElementById(id).selectedIndex=0);
  window._lat=null;window._lng=null;window._rid=null;_pick=null;
  initArea();
}

boot();
